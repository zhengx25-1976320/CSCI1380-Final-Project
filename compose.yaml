services:
  web:
    build: .
    image: gutenberg-search:local
    init: true
    ports: ["3000:3000"]
    environment:
      WORKER_MODE: remote
      WORKER_HOSTS: worker-0,worker-1,worker-2,worker-3,worker-4
      NODE_HOST: web
      RPC_PORT: "7070"
      DICTIONARY_PATH: /data/dictionary.txt
    volumes: ["coordinator-data:/data"]
    depends_on:
      worker-0:
        condition: service_healthy
      worker-1:
        condition: service_healthy
      worker-2:
        condition: service_healthy
      worker-3:
        condition: service_healthy
      worker-4:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
  worker-0:
    build: .
    image: gutenberg-search:local
    init: true
    command: ["node", "distribution.js"]
    environment:
      NODE_HOST: worker-0
      RPC_PORT: "8080"
    volumes: ["worker-0-data:/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
